name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
        if: runner.os != 'Windows'

  install-debian:
    name: real install (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: python3 -m ctf_forge tools install --no-aur
      - name: Verify tools
        run: python3 -m ctf_forge tools verify
      - name: Install skills from upstream
        run: |
          python3 -m ctf_forge skills install --dir "$RUNNER_TEMP/skills"
          count=$(ls "$RUNNER_TEMP/skills" | wc -l)
          echo "skills linked: $count"
          test "$count" -ge 10
          test -f "$RUNNER_TEMP/skills/solve-challenge/SKILL.md"
      - name: Kit script smoke test
        run: |
          echo 'flag{demo_flag}' > "$RUNNER_TEMP/sample.txt"
          python3 -m ctf_forge kit run analyze/triage.sh "$RUNNER_TEMP/sample.txt"

  install-arch:
    name: real install (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - run: pacman -Syu --noconfirm python git
      - uses: actions/checkout@v5
      - name: Install tools
        run: python3 -m ctf_forge tools install --no-aur
      - name: Verify tools
        run: python3 -m ctf_forge tools verify

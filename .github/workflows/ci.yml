name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          python3 -m py_compile scripts/setup.py
          bash -n install.sh
      - name: Dry run
        run: |
          for distro in arch debian macos; do
            python3 scripts/setup.py --dry-run --distro "$distro" --vault /tmp/vault-$distro
          done
